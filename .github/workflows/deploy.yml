name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cmark
        run: sudo apt-get install -y cmark

      - name: Generate HTML
        run: |
          mkdir -p dist
          cp robot/server/static/style.css dist/style.css
          cat > dist/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>BiMBrI</title>
              <link rel="stylesheet" href="style.css">
              <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
          </head>
          <body>
              $(cmark writeup.md)
              <footer>
                  <p>© 2026 BiMBrI contributors.
                  Software: <a href="https://opensource.org/licenses/MIT">MIT License</a>.
                  Content: <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
                  Unless otherwise noted.</p>
              </footer>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - id: deployment
        name: Deploy
        uses: actions/deploy-pages@v4
